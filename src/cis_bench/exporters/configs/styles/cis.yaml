# CIS Native XCCDF Export Mapping Configuration
# Maps CIS Benchmark data to clean CIS-centric XCCDF format
# Version: 1.0.0
# XCCDF Target: 1.2 (clean format optimized for general XCCDF tools)

metadata:
  style_name: "cis"
  description: "CIS Native clean XCCDF export"
  xccdf_version: "1.2"
  target_tools:
    - "OpenSCAP (commercial/non-DoD)"
    - "Generic XCCDF validators"
    - "Custom compliance tools"
    - "Research and analysis tools"
  conventions: "Clean CIS-centric format with separate elements (no embedded XML tags)"

# Group element specifications (xsdata types)
group_elements:
  title:
    xccdf_type: "TextWithSubType"
  description:
    xccdf_type: "HtmlTextWithSubType"

# Benchmark-level mappings
benchmark:
  # CIS-published form: xccdf_org.cisecurity.benchmarks_benchmark_<version>_<Title_With_Underscores>
  # e.g. xccdf_org.cisecurity.benchmarks_benchmark_1.0.0_CIS_Ubuntu_Linux_22.04_LTS_Benchmark
  # {version} and {title_slug} are the benchmark version and title reduced to NCName-safe text.
  id_template: "xccdf_org.cisecurity.benchmarks_benchmark_{version}_{title_slug}"

  # Namespace declarations (prefix -> URI); a style that extends this one inherits them
  namespaces:
    default: "http://checklists.nist.gov/xccdf/1.2"
    xccdf: "http://checklists.nist.gov/xccdf/1.2"
    xhtml: "http://www.w3.org/1999/xhtml"
    controls: "http://cisecurity.org/controls"
    cc6: "http://cisecurity.org/20-cc/v6.1"
    cc7: "http://cisecurity.org/20-cc/v7.0"
    cc8: "http://cisecurity.org/20-cc/v8.0"
    dc: "http://purl.org/dc/elements/1.1/"
    enhanced: "http://cisecurity.org/xccdf/enhanced/1.0"
    xsi: "http://www.w3.org/2001/XMLSchema-instance"

  # Profile generation - XCCDF 1.2 profileIdType pattern (xccdf_[^_]+_profile_.+)
  profiles:
    generate_from_rules: true
    # Every Profile id, from the profile's title (one rule for defined and named profiles)
    id_template: "xccdf_org.cisecurity.benchmarks_profile_{profile.title|slug:_}"
    # A profile description is stored as Markdown (converted when the page is read): written as it is
    description_transform: "none"
    # Copies saved without the page's profile definitions: per profile name on the rules,
    # the title, description and the profiles it includes (any other name gets a profile too)
    profile_mappings:
      - match: "Level 1 - Server"
        title: "Level 1 - Server"
        description: "CIS Level 1 recommendations for server environments"
      - match: "Level 1 - Workstation"
        title: "Level 1 - Workstation"
        description: "CIS Level 1 recommendations for workstation environments"
      - match: "Level 2 - Server"
        title: "Level 2 - Server"
        description: "CIS Level 2 recommendations for server environments"
        includes: ["Level 1 - Server"]  # Level 2 extends Level 1 (WorkBench profile definitions)
      - match: "Level 2 - Workstation"
        title: "Level 2 - Workstation"
        description: "CIS Level 2 recommendations for workstation environments"
        includes: ["Level 1 - Workstation"]  # Level 2 extends Level 1 (WorkBench profile definitions)
      - match: "Level 3 - Server"
        title: "Level 3 - Server"
        description: "CIS Level 3 recommendations for server environments"
      - match: "Level 3 - Workstation"
        title: "Level 3 - Workstation"
        description: "CIS Level 3 recommendations for workstation environments"
      - match: "Level 1"
        title: "Level 1"
        description: "CIS Level 1 recommendations"
      - match: "Level 2"
        title: "Level 2"
        description: "CIS Level 2 recommendations"
        includes: ["Level 1"]  # Level 2 extends Level 1 (WorkBench profile definitions)

  title:
    source: "title"
    transform: "none"
    xccdf_type: "TextType"
  description:
    source: "title"  # Use title as description
    transform: "none"
    xccdf_type: "HtmlTextWithSubType"
  version:
    source: "version"
    transform: "none"
    xccdf_type: "VersionType"
  notice:
    id: "terms-of-use"
    lang: "en"
    xccdf_type: "NoticeType"
    content: >-
      This XCCDF file was exported via cis-bench format conversion from
      "{benchmark.title}" ({benchmark.url}). Source benchmark content is
      copyright Center for Internet Security, Inc. (CIS) and subject to the CIS
      WorkBench Terms of Use (https://workbench.cisecurity.org/terms-of-use) and
      applicable CIS license terms.
  front_matter:
    xccdf_type: "HtmlTextWithSubType"
  rear_matter:
    xccdf_type: "HtmlTextWithSubType"

# Rule-level default attributes
rule_defaults:
  severity: "medium"  # CIS has no severity concept
  weight: "10.0"
  selected: "true"
  role: "full"

# ID Generation - CIS Native Format
# CIS uses descriptive IDs with organization prefix
# Variables: {stig_number}, {ref_normalized}

group_id:
  template: "xccdf_org.cisecurity.benchmarks_group_{ref_normalized}"
  description: "CIS Group ID format (includes CIS ref)"

rule_id:
  template: "xccdf_org.cisecurity.benchmarks_rule_{ref_normalized}"
  description: "CIS Rule ID format (includes CIS ref)"

# Rule element specifications (xsdata types for each Rule element)
rule_elements:
  version:
    xccdf_type: "VersionType"
    source: "ref"

  title:
    xccdf_type: "TextWithSubType"
    source: "title"

  description:
    xccdf_type: "HtmlTextWithSubType"
    source: "description"

  rationale:
    xccdf_type: "HtmlTextWithSubType"
    source: "rationale"

  warning:
    xccdf_type: "WarningType"
    source: "impact"

  reference:
    xccdf_type: "ReferenceType"
    multiple: true

  fixtext:
    xccdf_type: "FixTextType"
    source: "remediation"

  check:
    xccdf_type: "CheckType"
    source: "audit"

  metadata:
    xccdf_type: "MetadataType"

  cis_controls_metadata:
    xccdf_type: "MetadataType"

  cis_controls_ident:
    xccdf_type: "IdentType"

  references_ident:
    xccdf_type: "IdentType"

  mitre_techniques:
    xccdf_type: "IdentType"

  mitre_tactics:
    xccdf_type: "IdentType"

  mitre_mitigations:
    xccdf_type: "IdentType"

# Field mappings - Clean separated structure
field_mappings:

  # === CORE IDENTIFICATION ===
  version:
    target_element: "version"
    source_field: "ref"
    transform: "none"
    description: "CIS reference number (3.1.1, etc.)"

  title:
    target_element: "title"
    source_field: "title"
    transform: "none"

  # === CLEAN SEPARATED CONTENT ===
  # The stored text is Markdown (WorkBench's own form; a placeholder such as <user> is bare
  # angle brackets), written as it is: an HTML parser would read the placeholders as tags.
  # CIS's own XCCDF has no element for the default value and the additional information;
  # it folds extra sections into its text elements, so they follow the description here,
  # each under a label line (owner decision 2026-11-10), the stored Markdown as it is.
  description:
    target_element: "description"
    structure: "composite"
    separator: "\n\n"
    sources:
      - field: "description"
      - field: "default_value"
        label: "Default Value:"
      - field: "additional_info"
        label: "Additional Information:"
    description: "Description, then the default value and the additional information"

  rationale:
    target_element: "rationale"
    source_field: "rationale"
    transform: "none"
    description: "Separate rationale element, the stored Markdown"

  # === IMPACT AS WARNING (XCCDF standard for caveats) ===
  warning:
    target_element: "warning"
    source_field: "impact"
    transform: "none"
    attributes:
      category: "general"
    description: "Impact statement as XCCDF warning element"
    optional: true

  # === DIRECT NIST REFERENCES (No CCI, add ALL controls) ===
  reference:
    target_element: "reference"
    multiple: true
    source_field: "nist_controls"
    structure: "dublin_core"
    dc_elements:
      - element: "dc:title"
        content: "NIST SP 800-53"
      - element: "dc:identifier"
        content: "{nist_control_id}"
    attributes:
      href: "https://csrc.nist.gov/Projects/risk-management/sp800-53-controls"
    description: "Direct NIST 800-53 references (all cited controls, no CCI deduplication)"

  # === REMEDIATION ===
  fixtext:
    target_element: "fixtext"
    source_field: "remediation"
    transform: "none"
    description: "Remediation steps, the stored Markdown"

  # === AUDIT/CHECK ===
  check:
    target_element: "check"
    structure: "nested"
    children:
      - element: "check-content"
        source_field: "audit"
        transform: "none"
    description: "Audit procedure, the stored Markdown"

  # === CIS CONTROLS (Dual Representation - Official Pattern) ===

  # CIS Controls as METADATA (Official nested structure - matches CIS-CAT)
  cis_controls_metadata:
    target_element: "metadata"
    structure: "metadata_from_config"
    source_field: "cis_controls"
    requires_post_processing: true  # lxml elements injected after serialization
    metadata_spec:
      root_element: "cis_controls"
      namespace: "http://cisecurity.org/controls"
      namespace_prefix: "controls"
      allow_empty: true
      group_by: "item.version"
      group_element:
        element: "framework"
        attributes:
          urn: "urn:cisecurity.org:controls:{group_key}"
        item_element:
          element: "safeguard"
          attributes:
            title: "{item.title}"
            urn: "urn:cisecurity.org:controls:{item.version}:{item.control}"
          children:
            - element: "implementation_groups"
              attributes:
                ig1: "{item.ig1}"
                ig2: "{item.ig2}"
                ig3: "{item.ig3}"
            - element: "asset_type"
              content: "Unknown"
            - element: "security_function"
              content: "Protect"

  # CIS Controls as IDENT, in the form CIS-CAT benchmark XCCDF uses:
  #   <ident system="http://cisecurity.org/20-cc/v8.0"
  #          cc8:controlURI="http://cisecurity.org/20-cc/v8.0/control/8/subcontrol/5"/>
  # A whole control ("13") ends .../control/13. The value is empty.
  cis_controls_ident:
    target_element: "ident"
    structure: "ident_from_list"
    source_field: "cis_controls"
    ident_spec:
      system_template: "http://cisecurity.org/20-cc/v{item.version}.0"
      value_template: ""  # Empty per CIS convention
      attributes:
        - name: "controlURI"
          template: "http://cisecurity.org/20-cc/v{item.version}.0/control/{item.control|dotted_number_path:subcontrol}"
          namespace_prefix: "cc{item.version}"

  # Every line of the references field as an ident with system "URL", after the CIS
  # Controls idents: the form CIS's own XCCDF uses (a line that is not a URL is one too).
  references_ident:
    target_element: "ident"
    structure: "ident_from_list"
    source_field: "references"
    transform: "lines"
    ident_spec:
      system_template: "URL"
      value_template: "{item}"

  # === MITRE ATT&CK AS IDENT ELEMENTS (Not metadata - cleaner) ===

  mitre_techniques:
    target_element: "ident"
    structure: "ident_from_list"
    source_field: "mitre_mapping.techniques"
    ident_spec:
      system_template: "https://attack.mitre.org/techniques"
      value_template: "{item}"

  mitre_tactics:
    target_element: "ident"
    structure: "ident_from_list"
    source_field: "mitre_mapping.tactics"
    ident_spec:
      system_template: "https://attack.mitre.org/tactics"
      value_template: "{item}"

  mitre_mitigations:
    target_element: "ident"
    structure: "ident_from_list"
    source_field: "mitre_mapping.mitigations"
    ident_spec:
      system_template: "https://attack.mitre.org/mitigations"
      value_template: "{item}"

# CCI Deduplication - DISABLED for CIS native style
cci_deduplication:
  enabled: false
  description: "CIS native style includes ALL NIST controls as direct references"
  rationale: "No DoD CCI requirement, cleaner to have direct NIST 800-53 citations"

# Validation rules
validation:
  require_nist_controls: false
  require_cis_controls: false
  max_references_per_rule: 100  # Sanity check

# Post-processing for CIS format
# CIS-CAT and OpenSCAP need rich namespace declarations
post_processing:
  # Keep all namespaces - CIS format uses them for rich metadata
  strip_namespace_prefixes: false

  # Preserve all namespaces from the namespaces section
  preserve_namespaces: null  # null = keep all

  # Remove 'override' attributes (xsdata artifact)
  remove_override_attr: true

  # Handlers to run (includes metadata injection for CIS Controls)
  handlers:
    - metadata_injection
