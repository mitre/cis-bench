# DISA/DoD XCCDF Export Mapping Configuration
# Maps CIS Benchmark data to DISA STIG-compatible XCCDF format
# Version: 1.0.0
# XCCDF Target: 1.2 (backward compatible with 1.1.4 STIG tools)

# Inherit common configuration (namespaces, rule defaults, post-processing)
extends: ../base.yaml

# DISA/DoD STIG-compatible XCCDF export.
# Conventions: follows DISA STIG XML structure and element naming (conventions v1.10.0).
# Target tools: DISA SCAP Compliance Checker (SCC), OpenSCAP (DoD configurations), DISA STIG
# Viewer, Nessus (Government).
metadata:
  style_name: "disa"
  xccdf_version: "1.1.4"  # STIGs use 1.1.4, not 1.2

# Benchmark-level mappings
benchmark:
  # ID generation - DISA-compatible short format
  # Uses benchmark_id from CIS WorkBench (e.g., "CIS_23598")
  # Vulcan displays this in the STIG ID column
  id_template: "CIS_{benchmark_id}"

  # The namespaces DISA documents use (prefix -> URI), declared on the root by the
  # serializer: XCCDF 1.1 as the default namespace (STIG Viewer, Vulcan/HappyMapper read
  # unprefixed XCCDF) and Dublin Core for the reference metadata
  namespaces:
    default: "http://checklists.nist.gov/xccdf/1.1"
    dc: "http://purl.org/dc/elements/1.1/"

  # Profile generation - convert CIS profiles to XCCDF Profile elements
  profiles:
    generate_from_rules: true
    # Every Profile id, from the profile's title (one rule for defined and named profiles)
    id_template: "{profile.title|slug:-}"
    # A profile description is stored as Markdown (converted when the page is read): written as it is
    description_transform: "none"
    # Copies saved without the page's profile definitions: per profile name on the rules,
    # the title, description and the profiles it includes (any other name gets a profile too)
    profile_mappings:
      - match: "Level 1 - Server"
        title: "Level 1 - Server"
        description: "CIS Level 1 recommendations for server environments"
      - match: "Level 1 - Workstation"
        title: "Level 1 - Workstation"
        description: "CIS Level 1 recommendations for workstation environments"
      - match: "Level 2 - Server"
        title: "Level 2 - Server"
        description: "CIS Level 2 recommendations for server environments"
        includes: ["Level 1 - Server"]  # Level 2 extends Level 1 (WorkBench profile definitions)
      - match: "Level 2 - Workstation"
        title: "Level 2 - Workstation"
        description: "CIS Level 2 recommendations for workstation environments"
        includes: ["Level 1 - Workstation"]  # Level 2 extends Level 1 (WorkBench profile definitions)
      - match: "Level 3 - Server"
        title: "Level 3 - Server"
        description: "CIS Level 3 recommendations for server environments (new, not in all benchmarks)"
      - match: "Level 3 - Workstation"
        title: "Level 3 - Workstation"
        description: "CIS Level 3 recommendations for workstation environments (new, not in all benchmarks)"
      - match: "Level 1"
        title: "Level 1"
        description: "CIS Level 1 recommendations"
      - match: "Level 2"
        title: "Level 2"
        description: "CIS Level 2 recommendations"
        includes: ["Level 1"]  # Level 2 extends Level 1 (WorkBench profile definitions)

  # Namespaces inherited from base_style.yaml (common + controls/enhanced)
  # Can override here if needed for DISA-specific requirements

  # Core elements (with XCCDF type specifications)
  title:
    source: "title"
    transform: "none"

  description:
    source: "title"
    transform: "none"
    prepend_text: "CIS Benchmark exported to DISA STIG format. "

  version:
    source: "version"
    transform: "strip_version_prefix"  # "v4.0.0" → "4.0.0" (Vulcan adds "V" prefix)

  # STIG-required elements; front-matter and rear-matter are written empty in every style
  notice:
    id: "terms-of-use"
    lang: "en"
    content: >-
      This XCCDF file was exported via cis-bench format conversion from
      "{benchmark.title}" ({benchmark.url}). Source benchmark content is
      copyright Center for Internet Security, Inc. (CIS) and subject to the CIS
      WorkBench Terms of Use (https://workbench.cisecurity.org/terms-of-use) and
      applicable CIS license terms.

  # Dublin Core reference (STIG requirement)
  reference:
    attributes:
      href: "{benchmark.url}"
    dc_elements:
      - element: "dc:publisher"
        content: "CIS Security"
      - element: "dc:source"
        content: "https://workbench.cisecurity.org"

  # Plain-text metadata (STIG convention)
  plain_text:
    - id: "release-info"
      content: "Release: 1 Benchmark Date: {download_date}"
    - id: "generator"
      content: "cis-benchmark-cli 1.0.0"
    - id: "conventionsVersion"
      content: "1.10.0"

# Rule-level default attributes
rule_defaults:
  severity: "medium"  # CIS has no severity → default CAT II equivalent
  weight: "10.0"      # DISA standard

# ID Generation - DISA STIG Format
# DISA STIGs use V-NNNNNN for Groups and SV-NNNNNNrREV_rule for Rules
# We convert CIS refs (1.1.1) to padded numbers (010101) for STIG-style IDs
# Variables: {stig_number}, {ref_normalized}

# DISA STIG Group ID format (V-NNNNNN)
group_id:
  template: "V-{stig_number}"

# DISA STIG Rule ID format (SV-NNNNNNrREV_rule)
rule_id:
  template: "SV-{stig_number}r1_rule"
  # Note: r1 = revision 1, would increment on changes

# Field mappings - Order matters for composite fields!
field_mappings:

  # === CORE IDENTIFICATION ===
  version:
    target_element: "version"
    source_field: "ref"
    transform: "none"
    # CIS ref becomes STIG-style version (human-readable ID)

  title:
    target_element: "title"
    source_field: "title"
    transform: "none"

  # === DESCRIPTION (Complex - Embedded XML Tags) ===
  # A STIG rule description carries tags inside its text: VulnDiscussion and the ten tags
  # after it, in the order DISA writes them, every one present (empty when the rule has no
  # text for it). Each part's text is the stored Markdown; each tag is built by the XML
  # library, which escapes its text, so a reader that unescapes the description once and
  # parses the tags gets the text as stored, a placeholder such as <user> included.
  description:
    target_element: "description"
    structure: "embedded_xml_tags"
    components:
      - tag: "VulnDiscussion"
        sources:
          - field: "description"
            transform: "none"
            separator: "\n\n"
          - field: "rationale"
            transform: "none"

      - tag: "FalsePositives"
        content: ""

      - tag: "FalseNegatives"
        content: ""

      - tag: "Documentable"
        content: "false"

      - tag: "Mitigations"
        sources:
          - field: "additional_info"
            transform: "none"

      - tag: "SeverityOverrideGuidance"
        content: ""

      - tag: "PotentialImpacts"
        sources:
          - field: "impact"
            transform: "none"

      - tag: "ThirdPartyTools"
        content: ""

      - tag: "MitigationControl"
        content: ""

      - tag: "Responsibility"
        content: ""

      - tag: "IAControls"
        content: ""

  # === CCI IDENTIFIERS (DoD Standard for NIST Mapping) ===
  ident:
    target_element: "ident"
    multiple: true
    source_logic: "cci_lookup_with_deduplication"
    cci_lookup:  # used because source_logic is cci_lookup_with_deduplication
      # mapping_file: the bundled CIS-CCI mapping (src/cis_bench/data/cis-cci-mapping.json)
      # is read unless a style names its own, relative to that style's file
      source_field: "cis_controls"
      cis_controls_version: 8  # the mapping file is keyed by CIS Controls v8 only
      extract: "all"  # every CCI the mapping gives the safeguard, primary first; "primary" keeps only the first
      fallback_cci: "CCI-000366"  # Ensures every rule has at least one ident (DISA requirement)
    attributes:
      system: "http://cyber.mil/cci"

  # === NIST REFERENCES (Extras Not Covered by CCIs) ===
  reference:
    target_element: "reference"
    source_logic: "nist_after_cci_deduplication"  # one reference per NIST control no CCI states
    source_field: "nist_controls"
    structure: "dublin_core"
    dc_elements:
      - element: "dc:title"
        content: "NIST SP 800-53"
      - element: "dc:identifier"
        content: "{nist_control_id}"
    attributes:
      href: "https://csrc.nist.gov/Projects/risk-management/sp800-53-controls"

  # === REMEDIATION ===
  fixtext:
    target_element: "fixtext"
    source_field: "remediation"
    transform: "none"
    attributes:
      fixref: "F-{ref_normalized}"

  fix:
    target_element: "fix"
    # written empty: it has attributes and no source; the fix text is in fixtext
    attributes:
      id: "F-{ref_normalized}"

  # === AUDIT/CHECK ===
  check:
    target_element: "check"
    structure: "nested"
    attributes:
      system: "C-{ref_normalized}"
    children:
      - element: "check-content"
        source_field: "audit"
        transform: "none"

  # === CIS CONTROLS AS IDENT ELEMENTS ===
  # DISA STIGs use <ident> elements (like CCIs), not <metadata>
  cis_controls:
    target_element: "ident"
    structure: "ident_from_list"
    source_field: "cis_controls"
    ident_spec:
      system_template: "https://www.cisecurity.org/controls/v{item.version}"
      value_template: "{item.version}:{item.control}"

  # === MITRE ATT&CK AS IDENT ELEMENTS ===
  # Techniques, tactics, and mitigations as separate ident elements
  mitre_techniques:
    target_element: "ident"
    structure: "ident_from_list"
    source_field: "mitre_mapping.techniques"
    ident_spec:
      system_template: "https://attack.mitre.org/techniques"
      value_template: "{item}"

  mitre_tactics:
    target_element: "ident"
    structure: "ident_from_list"
    source_field: "mitre_mapping.tactics"
    ident_spec:
      system_template: "https://attack.mitre.org/tactics"
      value_template: "{item}"

  mitre_mitigations:
    target_element: "ident"
    structure: "ident_from_list"
    source_field: "mitre_mapping.mitigations"
    ident_spec:
      system_template: "https://attack.mitre.org/mitigations"
      value_template: "{item}"

# CCI Deduplication Configuration
# What the exporter does when enabled (the algorithm is the exporter's own, not a setting):
# every mapped CCI is written as an ident; every cited NIST control is written as a
# reference unless a CCI restates it.
#   1. Take the recommendation's CIS Controls of the mapping file's version
#      (cis_controls_version)
#   2. Look up every CCI of each safeguard (extract: all), primary first, each once
#   3. Note the control and enhancement each CCI sits under (CM-7 (1) (b) sits under CM-7(1))
#   4. Add the CCIs as <ident> elements
#   5. Add every cited NIST control as a <reference>, except one a CCI restates exactly
# A CCI restates only the control and enhancement it sits under (CM-7 (1) (b) does not
# stand for CM-7 or for CM-7(2)):
#   CCI maps to CM-7 (1) (b), CIS cites CM-7(1): restated, not written again
#   CCI maps to CM-7 (1) (b), CIS cites CM-7:    written (the base control is broader)
#   CCI maps to CM-7 b,       CIS cites CM-7(5): written (a different enhancement)
cci_deduplication:
  enabled: true

# Group element specifications (xsdata types for each Group element)
# Note: Groups are DISA wrappers - one Group per Rule (STIG convention)
# Each Group has elements (title, description) with specific xsdata types
group_elements:
  title:
    source: "ref"  # Use CIS ref (e.g., "6.1.1") - Vulcan displays as SRG ID
    # In DISA STIGs this would be SRG-OS-000xxx, but CIS has no SRG so we use ref

  description:
    source: "title"  # Use rule title as group description
    transform: "none"

# Post-processing overrides for DISA/STIG format
post_processing:
  # Remove 'override' attributes (xsdata artifact)
  remove_override_attr: true
