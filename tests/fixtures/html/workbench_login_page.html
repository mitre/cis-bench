<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Synthetic WorkBench Sign In</title>
</head>
<body>
  <div id="app">
    <div class="container-fluid main-container">
      <div class="index-signin-wrapper">
        <form class="index-form" role="form" method="POST" action="https://workbench.cisecurity.org/login">
          <div class="field-wrap form-group index-login-form-group">
            <label class="index-label control-label" for="login">E-Mail or Username</label>
            <input type="text" class="form-control" id="login" name="login" value="" autocomplete="off">
          </div>
          <div class="field-wrap form-group index-login-form-group">
            <label class="index-label control-label" for="password">Password</label>
            <input type="password" class="form-control" name="password" id="password" autocomplete="off">
          </div>
          <div class="form-group index-login-form-group">
            <label class="index-label"><input type="checkbox" name="remember"> Remember Me</label>
          </div>
          <div class="form-group index-login-form-group">
            <button type="submit" class="login-submit-btn btn btn-primary">Log In</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</body>
</html>
