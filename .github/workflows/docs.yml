name: Deploy Documentation

on:
  # Deploy after successful CI (covers both releases and docs-only changes)
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
    branches:
      - main

  # Manual trigger for docs deployment
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # Run if: manual dispatch, or CI succeeded for a push to main (branches: main above matches
    # the CI run's head branch, which a pull request from a branch named main also has)
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        (github.event_name == 'workflow_run' &&
         github.event.workflow_run.conclusion == 'success' &&
         github.event.workflow_run.event == 'push')
      }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install cis-bench, MkDocs and dependencies
        # The settings table in configuration.md is rendered from cis_bench.config at build
        # time (scripts/mkdocs_settings_table.py), so the package must be importable.
        run: |
          pip install . mkdocs-material mkdocs-autorefs

      - name: Build documentation
        run: mkdocs build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
